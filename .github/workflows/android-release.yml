# Baut eine signierte APK und veröffentlicht sie als GitHub-Release. Die App prüft beim Start die neueste
# Release und bietet das Update an. Signatur kommt aus Repo-Secrets; der Build bricht ab, wenn der
# Zertifikat-Fingerabdruck nicht dem in android-signing.sha256 entspricht (sonst wären Updates unmöglich).
name: Android Release

on:
  workflow_dispatch:
  push:
    branches: [main, ccr-44079d87-msrurq]
    paths: ['.github/workflows/android-release.yml', 'android-signing.sha256', 'src/**', 'android/**', 'capacitor.config.json', 'package.json', 'package-lock.json']

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      XP_VERSION_CODE: ${{ github.run_number }}
      XP_VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Secrets prüfen
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ]  || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KSP" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KA" ]  || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KP" ]  || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Fehlende Secrets:$missing – eintragen unter https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Tests
        run: npm ci && npm test

      - name: Version in die App schreiben
        run: |
          printf '{ "versionCode": %s, "versionName": "%s" }\n' "$XP_VERSION_CODE" "$XP_VERSION_NAME" > src/client/version.json
          cat src/client/version.json

      - name: Keystore bereitstellen
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "XP_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: APK bauen
        env:
          XP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          XP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          XP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew --no-daemon assembleRelease

      - name: Signatur prüfen
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          got=$(grep -m1 'SHA-256 digest' certs.txt | sed 's/.*: //' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          want=$(tr -d ' \n' < android-signing.sha256)
          if [ "$got" != "$want" ]; then echo "::error::Falscher Signaturschlüssel ($got). Erwartet $want."; exit 1; fi
          cp "$APK" "xp-hero-$XP_VERSION_NAME.apk"
          rm -f "$RUNNER_TEMP/release.p12"

      - name: APK als Artefakt (zum Testen, auch ohne Release)
        uses: actions/upload-artifact@v4
        with:
          name: xp-hero-${{ env.XP_VERSION_NAME }}
          path: xp-hero-${{ env.XP_VERSION_NAME }}.apk

      # Nur main veröffentlicht Releases; nur diese sieht die App als Update.
      - name: Release veröffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$XP_VERSION_NAME" "xp-hero-$XP_VERSION_NAME.apk" \
            --title "XP Hero $XP_VERSION_NAME" \
            --notes "Build $XP_VERSION_CODE aus ${GITHUB_SHA::7}. Installation über die vorhandene App: gleiche Signatur, Spielstand bleibt erhalten." \
            --target "$GITHUB_SHA"
